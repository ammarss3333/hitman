<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاتل مأجور – دخول</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<style>
body{
  display:flex;align-items:stretch;justify-content:stretch;
  min-height:100vh;background:var(--bg);margin:0;padding:0;
}
.auth-page{width:100%;display:flex;position:relative}
</style>
</head>
<body>

<div class="auth-bg"></div>
<div class="auth-particles" id="particles"></div>

<div class="auth-page">
<div class="auth-split">

  <!-- LEFT: hero branding -->
  <div class="auth-left">

    <!-- reticle / crosshair decoration -->
    <div class="auth-reticle">
      <div class="reticle-cross"></div>
      <div class="reticle-br tl"></div>
      <div class="reticle-br tr"></div>
      <div class="reticle-br bl"></div>
      <div class="reticle-br br"></div>
    </div>

    <div class="auth-hero-content">
      <div class="auth-game-label">OPERATIVE NETWORK — RESTRICTED ACCESS</div>
      <div class="auth-logo-text">قاتل مأجور</div>
      <div class="auth-tagline">عالم الجريمة والسلطة ينتظرك</div>
      <div class="auth-features">
        <div class="auth-feature">متعدد اللاعبين</div>
        <div class="auth-feature">عربي 100%</div>
        <div class="auth-feature">مجاني تماماً</div>
      </div>
    </div>

  </div>

  <!-- RIGHT: auth form panel -->
  <div class="auth-right">

    <div class="auth-panel-header">
      <div class="auth-panel-label">CLASSIFIED — EYES ONLY</div>
      <div class="auth-panel-title">ENTER CREDENTIALS</div>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="showTab('login')">تسجيل الدخول</div>
      <div class="auth-tab" id="tab-register" onclick="showTab('register')">إنشاء حساب</div>
    </div>

    <!-- LOGIN FORM -->
    <div id="form-login">
      <div class="fg">
        <label class="fl">البريد الإلكتروني</label>
        <input type="email" class="fc" id="l-email" placeholder="AGENT@DOMAIN.COM" autocomplete="email">
      </div>
      <div class="fg">
        <label class="fl">كلمة المرور</label>
        <input type="password" class="fc" id="l-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="l-err" style="display:none;margin-bottom:12px"></div>
      <button class="btn btn-r btn-full btn-lg" id="l-btn" onclick="doLogin()">دخول</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="form-register" style="display:none">
      <div class="fg">
        <label class="fl">اسم العميل</label>
        <input type="text" class="fc" id="r-name" placeholder="OPERATIVE_ID" maxlength="20" autocomplete="off">
      </div>
      <div class="fg">
        <label class="fl">البريد الإلكتروني</label>
        <input type="email" class="fc" id="r-email" placeholder="AGENT@DOMAIN.COM" autocomplete="email">
      </div>
      <div class="fg">
        <label class="fl">كلمة المرور</label>
        <input type="password" class="fc" id="r-pass" placeholder="8 أحرف على الأقل" autocomplete="new-password">
      </div>
      <div id="r-err" style="display:none;margin-bottom:12px"></div>
      <button class="btn btn-r btn-full btn-lg" id="r-btn" onclick="doRegister()">إنشاء حساب</button>
    </div>

    <div class="auth-footer-note">FREE TO PLAY · MULTIPLAYER · 100% ARABIC</div>

  </div><!-- /auth-right -->
</div><!-- /auth-split -->
</div><!-- /auth-page -->

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script>
// Subtle floating particles
(function(){
  const el = document.getElementById('particles');
  for (let i = 0; i < 12; i++) {
    const d = document.createElement('div');
    d.className = 'particle';
    d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*6}s;animation-duration:${5+Math.random()*5}s`;
    el.appendChild(d);
  }
})();

// Existing session check
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = 'home.html';
})();

// Banned account notice
(function() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('banned') === '1') {
    const reason = p.get('reason') || 'مخالفة قواعد اللعبة';
    const div = document.createElement('div');
    div.style.cssText = 'background:rgba(139,0,0,.12);border:1px solid rgba(139,0,0,.45);border-right:3px solid #dc143c;padding:12px 14px;margin-bottom:18px;color:#e85050;font-size:.8rem;font-family:Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase';
    div.innerHTML = `ACCESS DENIED<br><span style="font-size:.72rem;opacity:.75;font-family:Tajawal,sans-serif;text-transform:none">${reason}</span>`;
    const panel = document.querySelector('.auth-right');
    if (panel) panel.insertBefore(div, panel.firstChild);
  }
})();

function showTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.style.display = '';
  el.innerHTML = `<div style="background:rgba(139,0,0,.1);color:#e85050;border:1px solid rgba(139,0,0,.35);border-right:3px solid #dc143c;padding:9px 12px;font-size:.8rem;font-family:'Oswald',sans-serif;letter-spacing:.5px;text-transform:uppercase">${msg}</div>`;
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (!email || !pass) { showErr('l-err', 'أدخل البريد وكلمة المرور'); return; }
  const btn = document.getElementById('l-btn');
  btn.disabled = true; btn.textContent = 'AUTHENTICATING...';
  const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
  if (error) {
    showErr('l-err', error.message.includes('Invalid') ? 'بريد إلكتروني أو كلمة مرور خاطئة' : error.message);
    btn.disabled = false; btn.textContent = 'دخول';
  } else {
    btn.textContent = 'ACCESS GRANTED';
    window.location.href = 'home.html';
  }
}

async function doRegister() {
  const name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass = document.getElementById('r-pass').value;
  if (!name || !email || !pass) { showErr('r-err', 'أكمل جميع الحقول'); return; }
  if (name.length < 3) { showErr('r-err', 'اسم اللاعب يجب أن يكون 3 أحرف على الأقل'); return; }
  if (!/^[a-zA-Z0-9_؀-ۿ]+$/.test(name)) { showErr('r-err', 'اسم اللاعب يحتوي على رموز غير مسموحة'); return; }
  if (pass.length < 8) { showErr('r-err', 'كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }

  const btn = document.getElementById('r-btn');
  btn.disabled = true; btn.textContent = 'REGISTERING OPERATIVE...';

  try {
    const { data: existing, error: chkErr } = await supabase.from('players').select('id').eq('username', name).maybeSingle();
    if (chkErr) throw chkErr;
    if (existing) {
      showErr('r-err', 'اسم اللاعب مستخدم بالفعل');
      btn.disabled = false; btn.textContent = 'إنشاء حساب';
      return;
    }

    const { data, error } = await supabase.auth.signUp({
      email, password: pass,
      options: { data: { username: name } }
    });

    if (error) {
      showErr('r-err', error.message.includes('already') ? 'البريد الإلكتروني مستخدم بالفعل' : error.message);
      btn.disabled = false; btn.textContent = 'إنشاء حساب';
      return;
    }

    if (!data.session) {
      showErr('r-err', 'تم إنشاء الحساب! لكن تأكيد البريد مفعّل. عطّله من Supabase أو أكّد بريدك ثم سجّل دخول.');
      btn.disabled = false; btn.textContent = 'إنشاء حساب';
      return;
    }

    btn.textContent = 'OPERATIVE ENROLLED';
    toast('مرحباً بك! جاري الدخول...', 's');
    setTimeout(() => window.location.href = 'home.html', 1200);
  } catch (e) {
    showErr('r-err', 'خطأ في الاتصال: ' + (e.message || e));
    btn.disabled = false; btn.textContent = 'إنشاء حساب';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('form-login').style.display !== 'none') doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
