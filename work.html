<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العمل والمهنة – قاتل مأجور</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button class="mob-toggle" id="mob-toggle">☰</button>
<div class="overlay-mob" id="mob-overlay"></div>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="loading"><div class="spinner"></div><p>جاري التحميل...</p></div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/player.js"></script>
<script src="js/sounds.js"></script>
<script>
let player;

// خريطة الوظيفة ← إحصائية العمل (مطابقة لدالة job_work_stat في القاعدة)
const JOB_STAT = {
  mechanic: 'work_manual', driver: 'work_manual',
  hacker: 'work_intel',   dealer: 'work_intel',
  guard: 'work_endurance', bodyguard: 'work_endurance', assassin: 'work_endurance'
};
const STAT_META = {
  work_manual:    { label: 'عمل يدوي',     icon: '🔧', cls: 'ok'   },
  work_intel:     { label: 'عمل ذهني',     icon: '🧠', cls: 'en'   },
  work_endurance: { label: 'عمل بدني',     icon: '💪', cls: 'gold' }
};
function jobStat(jobId){ return JOB_STAT[jobId] || 'work_manual'; }

async function init() {
  player = await buildNav('work');
  if (!player) return;

  const { data: jobs } = await supabase.from('jobs').select('*').order('base_salary');
  const currentJob = jobs?.find(j => j.id === player.job_id);

  // تبريد الوردية — يوم اللعبة = 2 ساعة حقيقية
  const now = new Date();
  let shiftHoursLeft = null;
  if (player.last_shift) {
    const diff = (now - new Date(player.last_shift)) / 3600000;
    shiftHoursLeft = Math.max(0, 2 - diff);
  }
  const shiftReady = shiftHoursLeft === null || shiftHoursLeft === 0;
  // دالة لعرض الوقت المتبقي بالدقائق إن كان أقل من ساعة
  function fmtShiftLeft(h) {
    if (h >= 1) return h.toFixed(1) + ' ساعة';
    return Math.ceil(h * 60) + ' دقيقة';
  }

  const jp = player.job_points || 0;
  const wm = player.work_manual || 0, wi = player.work_intel || 0, we = player.work_endurance || 0;
  const streak = player.shift_streak || 0;

  // متطلبات الترقية للوظيفة الحالية
  let promo = null;
  if (currentJob) {
    const stat = jobStat(currentJob.id);
    const have = { work_manual: wm, work_intel: wi, work_endurance: we }[stat];
    const needStat = player.job_level * 50;
    const needJp = player.job_level * 3;
    promo = {
      stat, have, needStat, needJp,
      maxed: player.job_level >= currentJob.max_level,
      meets: have >= needStat && jp >= needJp
    };
  }

  const statBar = (key) => {
    const m = STAT_META[key];
    const val = { work_manual: wm, work_intel: wi, work_endurance: we }[key];
    // النسبة مرجعها هدف الترقية الحالي (job_level*50) لجعل الشريط ذا معنى
    const goal = currentJob ? Math.max(50, player.job_level * 50) : 100;
    return `
      <div style="flex:1;min-width:110px">
        <div class="flex items-c" style="justify-content:space-between;font-size:.72rem;color:var(--text2);margin-bottom:4px">
          <span>${m.icon} ${m.label}</span><span class="bold" style="color:var(--text)">${val}</span>
        </div>
        <div class="pbar"><div class="pbar-fill ${m.cls}" style="width:${pct(val, goal)}%"></div></div>
      </div>`;
  };

  document.getElementById('main').innerHTML = `
    <div class="page-hdr">
      <div class="page-icon">💼</div>
      <div>
        <div class="page-title">العمل <em>والمهنة</em></div>
        <div class="page-sub">اعمل وردية كل يوم لتبني مهنتك وتترقّى في سلّم العمل</div>
      </div>
    </div>

    ${currentJob ? `
    <div class="card mb16" style="border-color:rgba(0,230,118,.25);background:rgba(0,230,118,.05)">
      <div class="card-hdr">
        <div class="card-title">✅ وظيفتك الحالية</div>
        <button class="btn btn-ghost btn-sm" onclick="quitJob()">استقالة</button>
      </div>
      <div class="flex items-c gap14">
        <div style="font-size:2.5rem">${currentJob.image}</div>
        <div style="flex:1">
          <div style="font-size:1rem;font-weight:900">${currentJob.name}</div>
          <div style="font-size:.8rem;color:var(--text2);margin-top:3px">${currentJob.description}</div>
          <div class="flex flex-wrap gap8 mt8">
            <span class="badge badge-b">📊 درجة ${player.job_level}/${currentJob.max_level}</span>
            <span class="badge badge-gold">🎯 ${jp} نقطة عمل</span>
            <span class="badge ${streak>0?'badge-r':'badge-b'}">🔥 سلسلة ${streak} يوم</span>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap gap14 mt14">
        ${statBar('work_manual')}
        ${statBar('work_intel')}
        ${statBar('work_endurance')}
      </div>

      <div class="mt14">
        ${shiftReady
          ? `<button class="btn btn-g btn-full" onclick="doShift()">🛠️ بدء وردية اليوم</button>`
          : `<button class="btn btn-ghost btn-full" disabled>⏰ الوردية القادمة خلال ${fmtShiftLeft(shiftHoursLeft)}</button>`}
      </div>

      <div class="mt8">
        ${promo.maxed
          ? `<div class="text-c text-2 text-sm">🏆 وصلت للدرجة القصوى في هذه الوظيفة</div>`
          : `<button class="btn ${promo.meets?'btn-b':'btn-ghost'} btn-full" onclick="doPromotion()">
               📈 طلب ترقية ${promo.meets?'(مستوفى ✅)':''}
             </button>
             <div class="text-c text-2 text-sm mt8">
               تتطلب: ${STAT_META[promo.stat].icon} ${STAT_META[promo.stat].label}
               <span class="${promo.have>=promo.needStat?'':'text-r'}">${promo.have}/${promo.needStat}</span>
               · 🎯 نقاط <span class="${jp>=promo.needJp?'':'text-r'}">${jp}/${promo.needJp}</span>
             </div>`}
      </div>
    </div>

    <!-- متجر نقاط العمل -->
    <div class="card mb16">
      <div class="card-title mb6">🎓 متجر نقاط العمل</div>
      <div class="text-2 text-sm mb14">رصيدك: <span class="bold badge badge-gold">🎯 ${jp} نقطة</span> · 1 نقطة = +10 إحصائية عمل أو +20 طاقة</div>
      <div class="g2">
        <button class="btn btn-ghost btn-sm" ${jp<1?'disabled':''} onclick="spendPoints('train_manual')">🔧 +10 يدوي (1)</button>
        <button class="btn btn-ghost btn-sm" ${jp<1?'disabled':''} onclick="spendPoints('train_intel')">🧠 +10 ذهني (1)</button>
        <button class="btn btn-ghost btn-sm" ${jp<1?'disabled':''} onclick="spendPoints('train_endurance')">💪 +10 بدني (1)</button>
        <button class="btn btn-ghost btn-sm" ${jp<1||player.energy>=player.max_energy?'disabled':''} onclick="spendPoints('energy_refill')">⚡ +20 طاقة (1)</button>
      </div>
    </div>
    ` : `
    <div class="card mb16" style="border-color:rgba(255,152,0,.25);background:rgba(255,152,0,.05)">
      <div class="flex items-c gap10">
        <span style="font-size:1.5rem">⚠️</span>
        <div>
          <div class="bold" style="color:var(--orange)">ليس لديك وظيفة</div>
          <div class="text-2" style="font-size:.8rem">اختر وظيفة من القائمة وابدأ ورديتك اليومية</div>
        </div>
      </div>
    </div>
    `}

    <!-- قائمة الوظائف -->
    <div class="card">
      <div class="card-title mb14">🏢 الوظائف المتاحة</div>
      <div class="g2" id="jobs-grid">
        ${jobs.map(j => {
          const meetsStr = player.strength >= j.strength_req;
          const meetsInt = player.intelligence >= j.intelligence_req;
          const meetsLab = player.labor >= j.labor_req;
          const canApply = meetsStr && meetsInt && meetsLab;
          const isCurrent = player.job_id === j.id;
          const st = STAT_META[jobStat(j.id)];
          return `
            <div class="card" style="border-color:${isCurrent?'rgba(0,230,118,.35)':'var(--border)'};background:${isCurrent?'rgba(0,230,118,.04)':'var(--card)'}">
              <div class="flex items-c gap10 mb10">
                <span style="font-size:2rem">${j.image}</span>
                <div>
                  <div style="font-weight:700;font-size:.95rem">${j.name}</div>
                  <div class="text-2" style="font-size:.75rem">${j.description}</div>
                </div>
                ${isCurrent ? '<span class="badge badge-g">✅ حالياً</span>' : ''}
              </div>
              <div class="flex flex-wrap gap6 mb10">
                <span class="badge badge-gold">💰 ${$$(j.base_salary)}/وردية</span>
                <span class="badge badge-b">${st.icon} ينمّي ${st.label}</span>
              </div>
              <div class="mb10">
                <div style="font-size:.72rem;color:var(--text2);margin-bottom:5px">المتطلبات:</div>
                <div class="flex flex-wrap gap5">
                  ${j.strength_req?`<span class="badge ${player.strength>=j.strength_req?'badge-g':'badge-r'}">💪 ${j.strength_req}</span>`:''}
                  ${j.intelligence_req?`<span class="badge ${player.intelligence>=j.intelligence_req?'badge-g':'badge-r'}">🧠 ${j.intelligence_req}</span>`:''}
                  ${j.labor_req?`<span class="badge ${player.labor>=j.labor_req?'badge-g':'badge-r'}">🔧 ${j.labor_req}</span>`:''}
                  ${(!j.strength_req&&!j.intelligence_req&&!j.labor_req)?'<span class="badge badge-b">لا متطلبات</span>':''}
                </div>
              </div>
              ${isCurrent ? '' :
                canApply ?
                  `<button class="btn btn-r btn-full btn-sm" onclick="applyJob('${j.id}','${j.name}')">التقدم للوظيفة</button>` :
                  `<button class="btn btn-ghost btn-full btn-sm" disabled>غير مؤهل بعد</button>`}
            </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// ===== الوردية اليومية =====
async function doShift() {
  const btn = event.currentTarget;
  btn.disabled = true; btn.textContent = '⏳ جاري العمل...';
  const { data, error } = await supabase.rpc('work_shift');
  if (error || !data?.success) {
    sfxFail();
    toast(data?.message || error?.message || 'حدث خطأ', 'e');
    await init();
    return;
  }
  sfxSalary();
  const g = data.stat_gains || {};
  const m = STAT_META[g.stat] || { icon: '⭐', label: 'عمل' };
  openModal(`
    <div class="text-c">
      <div style="font-size:2.6rem">🛠️</div>
      <div class="card-title mt8">${data.message}</div>
      <div class="flex flex-wrap gap8 mt14" style="justify-content:center">
        <span class="badge badge-gold" style="font-size:.9rem">💰 +$${$$(data.cash_earned)}</span>
        <span class="badge badge-b" style="font-size:.9rem">🎯 +${data.job_points_earned} نقطة</span>
        <span class="badge badge-g" style="font-size:.9rem">${m.icon} +${g.amount||0} ${m.label}</span>
      </div>
      <div class="text-2 text-sm mt14">🔥 سلسلة العمل: ${data.streak} يوم متتالٍ</div>
      <button class="btn btn-g btn-full mt14" onclick="closeModal();init()">رائع!</button>
    </div>
  `);
}

// ===== الترقية =====
async function doPromotion() {
  const { data, error } = await supabase.rpc('request_promotion');
  if (error || !data?.success) {
    sfxFail();
    toast(data?.message || error?.message || 'حدث خطأ', 'w', 5000);
    return;
  }
  sfxLevelUp();
  toast(data.message, 's', 5000);
  await init();
}

// ===== متجر نقاط العمل =====
async function spendPoints(action) {
  const { data, error } = await supabase.rpc('spend_job_points', { p_action: action, p_amount: 1 });
  if (error || !data?.success) {
    sfxFail();
    toast(data?.message || error?.message || 'حدث خطأ', 'e');
    return;
  }
  if (action === 'energy_refill') sfxMoney(); else sfxTrain();
  toast(data.message, 's');
  await init();
}

// ===== التوظيف =====
async function applyJob(jobId, jobName) {
  confirm(`هل تريد التقدم لوظيفة "${jobName}"؟`, async () => {
    const { data, error } = await supabase.rpc('apply_for_job', { p_job_id: jobId });
    if (data?.success) { sfxSuccess(); } else { sfxFail(); }
    toast(data?.message || error?.message, data?.success ? 's' : 'e');
    if (data?.success) await init();
  });
}

async function quitJob() {
  confirm('هل تريد الاستقالة من وظيفتك؟ ستفقد درجتك الحالية وسلسلة العمل.', async () => {
    await supabase.from('players').update({
      job_id: null, job_level: 1, last_salary: null, last_shift: null, shift_streak: 0
    }).eq('id', player.id);
    toast('تم تقديم الاستقالة', 'i');
    await init();
  });
}

init();
</script>
</body>
</html>
